
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test autocomplétion - Vite et Gourmand</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        #suggestions {
            padding: 0;
            margin: 0;
            list-style: none;
            border: 1px solid #ccc;
        }

        #suggestions:empty {
            display: none;
        }

        #suggestions li {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        #suggestions li:hover,
        #suggestions li:focus {
            background: #f0f0f0;
        }

        #status {
            margin-top: 12px;
            color: #555;
        }

        #selection {
            margin-top: 24px;
            padding: 16px;
            background: #f5f5f5;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

    <h1>Test d'autocomplétion</h1>

    <p>
        Saisis une adresse française, puis sélectionne
        un résultat proposé par l'API.
    </p>

    <label for="address">Adresse</label>

    <input
        type="text"
        id="address"
        placeholder="Ex. : 12 rue Victor Hugo, Vernon"
        autocomplete="off"
        aria-autocomplete="list"
        aria-controls="suggestions"
    >

    <ul id="suggestions" role="listbox"></ul>

    <p id="status" aria-live="polite"></p>

    <section id="selection" hidden>
        <h2>Adresse sélectionnée</h2>
        <p id="fulltext"></p>
        <p id="kind"></p>
        <p id="coordinates"></p>
    </section>

    <script>
        const addressInput = document.querySelector("#address");
        const suggestionsList = document.querySelector("#suggestions");
        const status = document.querySelector("#status");
        const selection = document.querySelector("#selection");

        let debounceTimer;
        let currentController;

        addressInput.addEventListener("input", () => {
            clearTimeout(debounceTimer);

            if (currentController) {
                currentController.abort();
            }

            suggestionsList.replaceChildren();
            selection.hidden = true;

            const text = addressInput.value.trim();

            if (text.length < 3) {
                status.textContent =
                    "Saisis au moins 3 caractères.";
                return;
            }

            status.textContent = "Recherche en cours...";

            debounceTimer = setTimeout(() => {
                searchAddresses(text);
            }, 350);
        });

        async function searchAddresses(text) {
            currentController = new AbortController();

            const params = new URLSearchParams({
                text: text,
                terr: "METROPOLE",
                type: "StreetAddress",
                maximumResponses: "5"
            });

            const url =
                "https://data.geopf.fr/geocodage/completion/?" +
                params.toString();

            try {
                const response = await fetch(url, {
                    signal: currentController.signal
                });

                if (!response.ok) {
                    throw new Error(
                        `Erreur HTTP : ${response.status}`
                    );
                }

                const data = await response.json();

                console.log("Réponse complète de l'API :", data);

                displaySuggestions(data.results ?? []);

            } catch (error) {
                if (error.name === "AbortError") {
                    return;
                }

                console.error(error);

                status.textContent =
                    "Impossible de récupérer les adresses.";

                suggestionsList.replaceChildren();
            }
        }

        function displaySuggestions(results) {
            suggestionsList.replaceChildren();

            if (results.length === 0) {
                status.textContent = "Aucune suggestion trouvée.";
                return;
            }

            results.forEach((result) => {
                const item = document.createElement("li");

                item.setAttribute("role", "option");
                item.tabIndex = 0;
                item.textContent = result.fulltext;

                item.addEventListener("click", () => {
                    selectAddress(result);
                });

                item.addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        selectAddress(result);
                    }
                });

                suggestionsList.appendChild(item);
            });

            status.textContent =
                `${results.length} suggestion(s) trouvée(s).`;
        }

        function selectAddress(result) {
            addressInput.value = result.fulltext;

            suggestionsList.replaceChildren();
            status.textContent = "Adresse sélectionnée.";

            document.querySelector("#fulltext").textContent =
                result.fulltext ?? "Non renseigné";

            document.querySelector("#kind").textContent =
                "Type : " + (result.kind ?? "Non renseigné");

            document.querySelector("#coordinates").textContent =
                `Longitude : ${result.x ?? "inconnue"} | ` +
                `Latitude : ${result.y ?? "inconnue"}`;

            selection.hidden = false;

            console.log("Résultat sélectionné :", result);
        }
    </script>

</body>
</html>
